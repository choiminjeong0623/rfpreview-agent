name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rfp
          POSTGRES_PASSWORD: rfp
          POSTGRES_DB: rfp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfp" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # OCR 시험용 Tesseract (add-ocr)
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://rfp:rfp@localhost:5432/rfp_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 화면 타입(src/api.gen.ts)이 응답 스키마(openapi.json)와 같은지. openapi.json은 backend pytest가 대조한다
      - run: npm run check:api
      # 추적표(docs/추적표.md)가 지금 스펙·테스트와 같은지, 추적 도구 테스트 (add-spec-trace)
      - run: npm run check:trace
      - run: npm run build

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict
