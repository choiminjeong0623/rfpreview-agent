name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rfp
          POSTGRES_PASSWORD: rfp
          POSTGRES_DB: rfp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfp" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      # OCR 시험용 Tesseract (add-ocr)
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      # 합성 RFP 파일 24~28 (add-eval-demo): 합성 RFP·재현 채점 테스트가 건너뛰지 않고 돈다. 커밋하지 않는 파일
      - run: for s in evaluative deviation collaboration risk switch; do uv run --frozen python "../generate_${s}_rfp.py"; done
      - run: uv run --frozen pytest
        env:
          TEST_DATABASE_URL: postgresql://rfp:rfp@localhost:5432/rfp_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 화면 타입(src/api.gen.ts)이 응답 스키마(openapi.json)와 같은지. openapi.json은 backend pytest가 대조한다
      - run: npm run check:api
      # 추적표(docs/추적표.md)가 지금 스펙·테스트와 같은지, 추적 도구 테스트 (add-spec-trace)
      - run: npm run check:trace
      - run: npm run build

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict

  # 의존성 취약점과 저장소 비밀값 검사 (포트폴리오 점검 P1-7). 결과가 나오면 고치거나,
  # 고칠 수 없으면 근거를 docs/quality/security-scan.md에 남기고 무시 목록에 넣는다
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Python 의존성 (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 화면 의존성 (npm audit, 운영 의존성 high 이상)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: 비밀값 (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
