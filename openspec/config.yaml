schema: spec-driven

context: |
  Language: ko
  All artifacts must be written in ko.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  제품: 수백 쪽 RFP에서 지킬 조건은 빠짐없이(지키기), 내세울 강점은 근거와 함께(내세우기) 찾아 주는
  기술 검토 AI. 주 사용자는 입찰 기술 검토 엔지니어 한 명. 견적·품질·영업은 유형별로 전달받는 사람.
  원본 근거: docs/reference/기능요구사항명세서_v1.md (FR·CR·AR 번호), docs/reference/프로젝트기획서_v1.4.md.

  스택: Python 3.12 · FastAPI · Pydantic / LangGraph (멈춤 지점: 담당자 확인, 승인) /
  PostgreSQL 16 (db/migrations/*.sql 번호 순서) / React · Vite · TypeScript / Gemini API / Docker Compose.

  모든 change가 지켜야 하는 공통 규칙 (명세서 2장):
  - CR-01 숫자 계산·판정·후보 고르기·분기 선택은 코드, 문장 읽기·쓰기만 AI, 확정은 사람.
  - CR-02/03 시스템이 만드는 모든 값은 {값, 원문 위치(파일 번호+절 또는 표+행), 신뢰도, 가정 여부}를 가진다.
    원문 위치가 없으면 결과로 내보내지 않고 "확인 필요".
  - CR-04/05 없는 값은 지어내지 않는다. [REDACTED]는 "값 없음".
  - CR-06 팀 가정 값이 들어간 결과는 항상 "팀 가정" 표시.
  - CR-07 AI 문장 속 숫자는 자리표시자로 두고 코드가 채운 뒤 근거와 대조한다.
  - CR-08 위험 조건·일탈·질의·보증값·제안 포인트는 모두 "후보". 확정은 사람.
  - CR-09 적합성 판정·보증값은 묶음 A·B 문서만.
  - CR-10 단위 환산을 하지 않는다. 단위가 다르면 "확인 필요".
  - CR-11 같은 입력·같은 사전·같은 제품표면 숫자·판정 결과가 같다.
  - CR-12 AI 오류는 정해진 횟수만 재시도한 뒤 "처리 실패 — 다시 시도".
  일정: 10-29 핵심 흐름 시연, 10-31 Must 완료, 11-04 기능 동결.

rules:
  proposal:
    - 관련 FR·CR·AR 번호와 추적표 v3 사례 번호를 Why 또는 What Changes에 적는다.
    - 아직 만들지 않는 기능(7장 보류·제외. Should FR-11·12·15는 만듦)은 Non-Goals나 범위 밖으로 명시한다.
  specs:
    - 명세서의 수용 기준(Given-When-Then)은 빠짐없이 Scenario로 옮긴다. Given은 WHEN 앞의 조건 문장으로 쓴다.
    - "[확인 필요]"나 "[제안]"으로 표시된 명세서 내용은 요구사항 설명 끝에 그 표시를 남긴다.
  tasks:
    - 각 Scenario를 검증하는 자동 테스트 작업을 포함한다.
    - 마지막 작업 묶음은 openspec validate --strict 통과와 archive이다.
