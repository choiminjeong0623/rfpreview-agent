[project]
name = "rfp-agent"
version = "0.1.0"
description = "RFP 기술 검토·견적 지원 AI 시스템 백엔드"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "python-docx>=1.2.0",
  "langgraph>=1.2.16",
  "google-genai>=2.33.0",
  "python-multipart>=0.0.32",
  "openpyxl>=3.1.5",
  "langgraph-checkpoint-postgres>=3.2.0",
  "pdfplumber>=0.11.10",
  "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "reportlab>=5.1.0",
]

[project.scripts]
rfp-db = "rfp_agent.db.cli:main"
rfp-review = "rfp_agent.cli:main"
rfp-openapi = "rfp_agent.api.main:dump_openapi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: PostgreSQL이 필요한 테스트 (TEST_DATABASE_URL이 없으면 건너뜀)"]
